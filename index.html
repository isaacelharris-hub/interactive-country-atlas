<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#020914;color:#eaf5ff;font-family:Outfit,sans-serif}#g{position:fixed;inset:0}.top{position:fixed;z-index:2;top:0;width:100%;padding:28px 32px;display:flex;justify-content:space-between;font:12px 'DM Mono',monospace;letter-spacing:.14em;pointer-events:none}.top b,.eye{color:#62e8ff}.hint,p,.native{color:#9eb2c5}#intro{position:fixed;z-index:2;left:32px;bottom:28px;max-width:335px}h1{font-size:48px;line-height:.94;letter-spacing:-.06em;margin:0 0 12px}p{font-size:15px;line-height:1.5}#flag{padding:7px;border:1px solid #fff5;border-radius:13px;background:#ffffff22;backdrop-filter:blur(12px);box-shadow:0 12px 38px #0009;transform:translate(-50%,-120%);pointer-events:none;animation:in .3s ease}#flag img{display:block;width:110px;height:70px;object-fit:cover;border-radius:7px}#flag span{display:block;text-align:center;margin-top:5px;font-size:12px}@keyframes in{from{opacity:0;transform:translate(-50%,-90%) scale(.6)}to{opacity:1;transform:translate(-50%,-120%) scale(1)}}#panel{position:fixed;z-index:5;right:16px;top:16px;bottom:16px;width:min(450px,calc(100vw - 32px));padding:28px;overflow:auto;background:#071426e8;backdrop-filter:blur(20px);border:1px solid #ffffff25;border-radius:20px;box-shadow:-15px 0 60px #0009;transform:translateX(calc(100% + 25px));transition:.4s}#panel.open{transform:none}button{float:right;background:none;border:0;color:white;font-size:27px;cursor:pointer}.eye{font:11px 'DM Mono',monospace;letter-spacing:.12em}h2{font-size:38px;line-height:1;letter-spacing:-.05em;margin:9px 35px 6px 0}.native{margin-bottom:20px}.hero{width:122px;height:78px;object-fit:cover;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.fact{min-height:70px;padding:11px;border:1px solid #ffffff1c;border-radius:11px;background:#fff1}.fact label{display:block;font:10px 'DM Mono',monospace;color:#9eb2c5;margin-bottom:7px}.fact span{font-size:14px;overflow-wrap:anywhere}details{margin-top:18px;border-top:1px solid #ffffff22;padding-top:15px;color:#9eb2c5}summary{color:white;cursor:pointer}pre{white-space:pre-wrap;font:10px/1.35 'DM Mono',monospace}@media(max-width:600px){.top{padding:20px}.hint{display:none}#intro{left:20px;bottom:20px}h1{font-size:38px}#panel{inset:8px;width:auto}}</style></head><body>
<div id="g"></div><header class="top"><span><b>◉</b> ATLAS / 03</span><span class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · CLICK A COUNTRY</span></header><section id="intro"><h1>A world<br>waiting to be read.</h1><p>Hover over a country to let its flag emerge. Click it for a living country profile.</p></section><aside id="panel"><button id="x">×</button><div id="out"></div></aside>
<script src="https://unpkg.com/three"></script><script src="https://unpkg.com/globe.gl"></script><script>
const out=document.querySelector('#out'),panel=document.querySelector('#panel'),flags=new Map();let hot=null;
const safe=x=>String(x||'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const globe=Globe()(document.querySelector('#g')).backgroundColor('#020914').globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg').bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png').atmosphereColor('#62e8ff').atmosphereAltitude(.18).polygonAltitude(.006).polygonSideColor(()=>'transparent').polygonStrokeColor(()=>'rgba(98,232,255,.25)').polygonCapColor(d=>d===hot?'rgba(98,232,255,.035)':'rgba(22,82,122,.42)').onPolygonHover(hover).onPolygonClick(show).htmlLat(d=>d.properties.la).htmlLng(d=>d.properties.lo).htmlElement(flag);
globe.pointOfView({lat:18,lng:8,alt:2.25});globe.controls().autoRotate=true;globe.controls().autoRotateSpeed=.28;
function flag(d){let c=flags.get(d.properties.ISO_A3),e=document.createElement('div');if(!c)return e;e.id='flag';e.innerHTML='<img src="https://flagcdn.com/w320/'+c.cca2.toLowerCase()+'.png"><span>'+safe(c.name.common)+'</span>';return e}
function hover(d){hot=d;globe.polygonsData(globe.polygonsData());globe.htmlElementsData(d&&flags.has(d.properties.ISO_A3)?[d]:[])}
function box(k,v){return '<div class="fact"><label>'+k+'</label><span>'+safe(v)+'</span></div>'}
async function show(d){panel.classList.add('open');out.innerHTML='<p>Loading country profile…</p>';try{let c=(await (await fetch('https://restcountries.com/v3.1/alpha/'+d.properties.ISO_A3)).json())[0],vals=o=>Object.values(o||{}).join(', '),num=n=>new Intl.NumberFormat().format(n||0);out.innerHTML='<div class="eye">'+safe(c.region)+' / '+safe(c.subregion)+'</div><h2>'+safe(c.name.common)+'</h2><div class="native">'+safe(vals(c.name.nativeName?Object.fromEntries(Object.entries(c.name.nativeName).map(a=>[a[0],a[1].common])):{}))+'</div><img class="hero" src="'+c.flags.png+'"><div class="grid">'+box('Capital',(c.capital||[]).join(', '))+box('Population',num(c.population))+box('Area',num(c.area)+' km²')+box('Languages',vals(c.languages))+box('Currencies',vals(c.currencies))+box('Time zones',(c.timezones||[]).join(', '))+box('Borders',(c.borders||[]).join(', '))+box('Independent',c.independent?'Yes':'No')+'</div><details><summary>Full country data</summary><pre>'+safe(JSON.stringify(c,null,2))+'</pre></details>'}catch(e){out.innerHTML='<p>Unable to load this profile. Check your connection.</p>'}}
document.querySelector('#x').onclick=()=>panel.classList.remove('open');
Promise.all([fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>r.json()),fetch('https://restcountries.com/v3.1/all?fields=cca2,cca3,name').then(r=>r.json())]).then(([geo,list])=>{list.forEach(c=>flags.set(c.cca3,c));geo.features.forEach(f=>{let a=JSON.stringify(f.geometry.coordinates).match(/-?\d+(?:\.\d+)?/g).map(Number),n=0,la=0,lo=0;for(let i=0;i<a.length;i+=2){lo+=a[i];la+=a[i+1];n++}f.properties.la=la/n;f.properties.lo=lo/n});globe.polygonsData(geo.features)});addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));globe.width(innerWidth).height(innerHeight);
</script></body></html>
