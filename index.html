<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — World Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#63ebff;--ink:#eef8ff;--muted:#a1b4c6}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#020914;color:var(--ink);font-family:Outfit,Arial,sans-serif}#globe{position:fixed;inset:0}.bar{position:fixed;inset:0 0 auto;z-index:2;display:flex;justify-content:space-between;padding:28px 34px;pointer-events:none;font:12px 'DM Mono',monospace;letter-spacing:.12em}.bar b,.eyebrow{color:var(--cyan)}.help{color:var(--muted);font-size:10px}#welcome{position:fixed;z-index:2;left:34px;bottom:30px;width:330px}h1{font-size:50px;line-height:.92;letter-spacing:-.065em;margin:0 0 12px}p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}#flag{padding:7px;background:#ffffff24;border:1px solid #ffffff55;border-radius:13px;backdrop-filter:blur(14px);box-shadow:0 12px 42px #000a;transform:translate(-50%,-118%);pointer-events:none;animation:appear .32s ease-out}#flag img{display:block;width:112px;height:71px;object-fit:cover;border-radius:7px}#flag span{display:block;text-align:center;margin:5px 1px 0;font-size:12px;font-weight:600}@keyframes appear{from{opacity:0;transform:translate(-50%,-85%) scale(.65)}to{opacity:1;transform:translate(-50%,-118%) scale(1)}}#card{position:fixed;z-index:5;top:16px;right:16px;bottom:16px;width:min(450px,calc(100vw - 32px));padding:28px;overflow:auto;border:1px solid #ffffff27;border-radius:22px;background:#071427e9;backdrop-filter:blur(21px);box-shadow:-18px 0 70px #000a;transform:translateX(calc(100% + 30px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}#card.open{transform:translateX(0)}#close{float:right;background:none;border:0;color:white;font-size:27px;cursor:pointer}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.11em}h2{font-size:39px;line-height:1;letter-spacing:-.055em;margin:8px 35px 6px 0}.native{color:var(--muted);font:12px 'DM Mono',monospace;margin-bottom:20px}.mainflag{width:124px;height:79px;object-fit:cover;border-radius:10px;box-shadow:0 8px 24px #000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.fact{padding:11px;min-height:70px;border:1px solid #ffffff1e;border-radius:11px;background:#fff1}.fact label{display:block;color:var(--muted);font:10px 'DM Mono',monospace;letter-spacing:.06em;margin-bottom:7px}.fact span{font-size:14px;overflow-wrap:anywhere}details{margin-top:18px;border-top:1px solid #ffffff20;padding-top:14px;color:var(--muted)}summary{cursor:pointer;color:var(--ink)}pre{white-space:pre-wrap;font:10px/1.4 'DM Mono',monospace}@media(max-width:600px){.bar{padding:20px}.help{display:none}#welcome{left:20px;bottom:20px;width:275px}h1{font-size:39px}#card{inset:8px;width:auto}}</style>
</head><body><div id="globe"></div><div class="bar"><span><b>◉</b> ATLAS / 03</span><span class="help">DRAG TO ORBIT · SCROLL TO ZOOM · CLICK A COUNTRY</span></div><section id="welcome"><h1>A world<br>waiting to be read.</h1><p>Hover over a country and its flag emerges. Click a country for its complete profile.</p></section><aside id="card"><button id="close" aria-label="Close">×</button><div id="details"></div></aside>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/globe.gl"></script><script src="https://unpkg.com/topojson-client@3"></script>
<script>
const globeHost=document.querySelector('#globe'),card=document.querySelector('#card'),details=document.querySelector('#details'),countryByNumber=new Map();let active=null;
const clean=x=>String(x||'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const globe=Globe()(globeHost).backgroundColor('#020914').globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').showAtmosphere(true).atmosphereColor('#63ebff').atmosphereAltitude(.17).polygonAltitude(.006).polygonSideColor(()=>'rgba(0,0,0,0)').polygonStrokeColor(()=>'rgba(105,233,255,.25)').polygonCapColor(d=>d===active?'rgba(99,235,255,.04)':'rgba(19,76,116,.48)').onPolygonHover(onHover).onPolygonClick(showCountry).htmlLat(d=>d.properties.lat).htmlLng(d=>d.properties.lng).htmlElement(makeFlag);
globe.pointOfView({lat:20,lng:8,alt:2.25},0);globe.controls().autoRotate=true;globe.controls().autoRotateSpeed=.27;
function makeFlag(d){const c=countryByNumber.get(d.properties.num),el=document.createElement('div');if(!c)return el;el.id='flag';el.innerHTML='<img src="https://flagcdn.com/w320/'+c.cca2.toLowerCase()+'.png" alt=""><span>'+clean(c.name.common)+'</span>';return el}
function onHover(d){active=d;globe.polygonsData(globe.polygonsData());globe.htmlElementsData(d&&countryByNumber.has(d.properties.num)?[d]:[])}
function fact(k,v){return '<div class="fact"><label>'+k+'</label><span>'+clean(v)+'</span></div>'}
function values(o){return Object.values(o||{}).join(', ')}
async function showCountry(d){card.classList.add('open');details.innerHTML='<p>Loading country profile…</p>';const cached=countryByNumber.get(d.properties.num);if(!cached){details.innerHTML='<p>This territory does not have a country profile in the data source.</p>';return}try{const response=await fetch('https://restcountries.com/v3.1/alpha/'+cached.cca3);if(!response.ok)throw Error('profile unavailable');const c=(await response.json())[0],native=values(Object.fromEntries(Object.entries(c.name.nativeName||{}).map(a=>[a[0],a[1].common]))),number=new Intl.NumberFormat();details.innerHTML='<div class="eyebrow">'+clean(c.region)+' / '+clean(c.subregion)+'</div><h2>'+clean(c.name.common)+'</h2><div class="native">'+clean(native)+'</div><img class="mainflag" src="'+c.flags.png+'" alt="Flag"><div class="grid">'+fact('Capital',(c.capital||[]).join(', '))+fact('Population',number.format(c.population||0))+fact('Area',number.format(c.area||0)+' km²')+fact('Languages',values(c.languages))+fact('Currencies',values(c.currencies))+fact('Time zones',(c.timezones||[]).join(', '))+fact('Borders',(c.borders||[]).join(', '))+fact('Independent',c.independent?'Yes':'No')+'</div><details><summary>Everything from the country data source</summary><pre>'+clean(JSON.stringify(c,null,2))+'</pre></details>'}catch(error){details.innerHTML='<p>The map is working, but this country profile could not be loaded. Please try again.</p>'}}
document.querySelector('#close').onclick=()=>card.classList.remove('open');
async function loadMap(){try{const world=await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')).json();const features=topojson.feature(world,world.objects.countries).features;features.forEach(f=>{const p=f.properties||{},numbers=JSON.stringify(f.geometry.coordinates).match(/-?\d+(?:\.\d+)?/g).map(Number);let lat=0,lng=0,total=0;for(let i=0;i<numbers.length;i+=2){lng+=numbers[i];lat+=numbers[i+1];total++}p.num=String(f.id).padStart(3,'0');p.lng=lng/total;p.lat=lat/total;f.properties=p});globe.polygonsData(features)}catch(error){details.innerHTML='<p>Map data could not load. Refresh the page to retry.</p>'}}async function loadCountries(){try{const list=await (await fetch('https://restcountries.com/v3.1/all?fields=cca2,cca3,ccn3,name')).json();list.forEach(c=>{if(c.ccn3)countryByNumber.set(String(c.ccn3).padStart(3,'0'),c)})}catch(error){console.warn('Country profiles unavailable',error)}}loadMap();loadCountries();addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));globe.width(innerWidth).height(innerHeight);
</script></body></html>
